[project]
name = "signals-api"
version = "0.1.0"
description = "Corporate Intent Intelligence API — interpreted B2B signals from SEC EDGAR (Form D + 8-K) and public ATS job boards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "supabase>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
worker = "worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repo holds three top-level packages (the shared `core`, the `worker`, and
# the read `api`). Declare them explicitly so the editable install exposes all three.
[tool.hatch.build.targets.wheel]
packages = ["core", "worker", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
